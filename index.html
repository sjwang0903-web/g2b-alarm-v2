<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 입찰·정비사업 모니터링 대시보드 (알리미2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow">
                    <i class="fa-solid fa-building-user text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight">스마트 입찰·정비사업 모니터링</h1>
                    <p class="text-xs text-slate-400">G2B 나라장터 실시간 대시보드 (알리미2)</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <div id="action-status-badge" class="hidden sm:flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="update-time-text">Actions 연동 대기중...</span>
                </div>

                <button onclick="loadNotices()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i> 새로고침
                </button>
                <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex items-center text-xs">
                    <button id="btn-user-mode" onclick="requestAuth(false)" class="px-3 py-1.5 rounded-md font-medium transition text-white bg-blue-600">
                        <i class="fa-solid fa-user"></i> 사용자
                    </button>
                    <button id="btn-admin-mode" onclick="requestAuth(true)" class="px-3 py-1.5 rounded-md font-medium transition text-slate-400 hover:text-white">
                        <i class="fa-solid fa-user-gear"></i> 관리자
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pt-6 space-y-6">
        <div id="status-bar" class="hidden bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl flex justify-between items-center text-sm shadow-sm">
            <span id="status-msg"><i class="fa-solid fa-circle-info mr-2"></i>데이터를 불러오는 중입니다...</span>
            <button onclick="document.getElementById('status-bar').classList.add('hidden')" class="text-blue-400 hover:text-blue-600">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- 탭 및 검색 바 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
            <div class="flex flex-wrap gap-2">
                <button onclick="filterType('ALL')" id="tab-ALL" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white shadow-sm">전체</button>
                <button onclick="filterType('본공고')" id="tab-본공고" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-blue-700 bg-blue-50 hover:bg-blue-100">본공고</button>
                <button onclick="filterType('민간입찰')" id="tab-민간입찰" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-purple-700 bg-purple-50 hover:bg-purple-100">정비사업본공고</button>
                <button onclick="filterType('사전규격')" id="tab-사전규격" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100">사전규격</button>
                <button onclick="filterType('발주계획')" id="tab-발주계획" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium text-orange-700 bg-orange-50 hover:bg-orange-100">발주계획</button>
            </div>
            <div class="relative flex-1 max-w-md">
                <input type="text" id="search-input" onkeyup="renderDashboard()" placeholder="공고명, 기관명 검색..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
            </div>
        </div>

        <!-- 본문 그리드 레이아웃 -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                        <span>공고 목록</span>
                        <span id="notice-count" class="bg-blue-100 text-blue-700 text-xs px-2.5 py-0.5 rounded-full font-semibold">0</span>
                    </h2>
                    <span id="admin-notice-info" class="text-xs text-amber-600 hidden font-medium">관리자 모드 (숨김 포함)</span>
                </div>
                <div id="notice-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- 우측 사이드바 (달력 및 달력 아래 공고진행현황) -->
            <div class="space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 sticky top-24 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-800 text-sm"><i class="fa-regular fa-calendar-days text-blue-600 mr-1"></i> 일정 달력</h3>
                        <div class="flex items-center gap-1">
                            <button onclick="changeMonth(-1)" class="p-1 text-slate-500 hover:text-slate-800"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                            <span id="calendar-month" class="text-xs font-bold text-slate-700 min-w-[70px] text-center"></span>
                            <button onclick="changeMonth(1)" class="p-1 text-slate-500 hover:text-slate-800"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-1">
                        <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 text-center text-xs gap-1"></div>

                    <!-- 달력 밑에 고정 표시되는 공고진행현황 영역 -->
                    <div class="pt-3 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-2">
                            <span id="selected-date-label" class="font-bold text-xs text-slate-700">날짜를 선택하세요</span>
                            <span id="selected-count" class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">0건</span>
                        </div>
                        <div id="calendar-day-notices" class="space-y-2 max-h-48 overflow-y-auto text-xs pr-1">
                            <div class="text-slate-400 text-center py-4 bg-slate-50 rounded-lg border border-dashed border-slate-200">달력의 날짜를 클릭하면 해당 날짜의 공고가 표시됩니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 공고 클릭 시 상세 내용을 보여주는 팝업 모달 -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden border border-slate-200">
            <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <span id="modal-badge" class="px-2 py-0.5 text-xs rounded font-bold"></span>
                    <span>공고 상세 정보</span>
                </h3>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modal-content-body" class="p-6 overflow-y-auto space-y-4 text-sm bg-slate-50"></div>
        </div>
    </div>

    <script>
        let allNotices = [];
        let currentTypeFilter = 'ALL';
        let isAdmin = false;
        let currentCalendarDate = new Date();

        const USER_PASSWORD = "user1234";
        const ADMIN_PASSWORD = "admin5678";

        document.addEventListener('DOMContentLoaded', () => {
            loadNotices();
        });

        function requestAuth(toAdmin) {
            const pass = prompt(toAdmin ? "관리자 비밀번호를 입력하세요." : "사용자 비밀번호를 입력하세요.", "");
            if (toAdmin && pass !== ADMIN_PASSWORD) { alert("비밀번호가 틀렸습니다."); return; }
            if (!toAdmin && pass !== USER_PASSWORD) { alert("비밀번호가 틀렸습니다."); return; }
            isAdmin = toAdmin;
            document.getElementById('btn-user-mode').className = isAdmin ? "px-3 py-1.5 rounded-md font-medium transition text-slate-400 hover:text-white" : "px-3 py-1.5 rounded-md font-medium transition text-white bg-blue-600";
            document.getElementById('btn-admin-mode').className = isAdmin ? "px-3 py-1.5 rounded-md font-medium transition text-white bg-amber-600" : "px-3 py-1.5 rounded-md font-medium transition text-slate-400 hover:text-white";
            document.getElementById('admin-notice-info').classList.toggle('hidden', !isAdmin);
            renderDashboard();
        }

        async function loadNotices() {
            try {
                const res = await fetch(`notices.json?t=${new Date().getTime()}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    allNotices = data;
                } else {
                    allNotices = data.notices || [];
                    if (data.last_updated) {
                        document.getElementById('update-time-text').innerText = `최근 갱신: ${data.last_updated}`;
                        document.getElementById('action-status-badge').classList.remove('hidden');
                    }
                }
                
                const localState = JSON.parse(localStorage.getItem('notice_local_state') || '{}');
                allNotices.forEach(n => {
                    if (localState[n.id]) {
                        if (localState[n.id].isHidden !== undefined) n.isHidden = localState[n.id].isHidden;
                        if (localState[n.id].isImportant !== undefined) n.isImportant = localState[n.id].isImportant;
                        if (localState[n.id].isChecked !== undefined) n.isChecked = localState[n.id].isChecked;
                    }
                });
                showStatus("✅ 데이터를 성공적으로 불러왔습니다.");
            } catch (e) {
                showStatus("⚠️ notices.json 파일이 없습니다. 액션을 실행해 주세요.", "warning");
                allNotices = [];
            } finally {
                renderDashboard();
                // 오늘 날짜 기본 선택 로직
                const todayStr = new Date().toISOString().slice(0, 10);
                selectCalendarDate(todayStr);
            }
        }

        function getCategoryBadge(type) {
            switch(type) {
                case '본공고': return { bg: 'bg-blue-100 text-blue-700 border-blue-200', dot: 'bg-blue-500', name: '본공고' };
                case '민간입찰': return { bg: 'bg-purple-100 text-purple-700 border-purple-200', dot: 'bg-purple-500', name: '정비사업본공고' };
                case '사전규격': return { bg: 'bg-emerald-100 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500', name: '사전규격' };
                case '발주계획': return { bg: 'bg-orange-100 text-orange-700 border-orange-200', dot: 'bg-orange-500', name: '발주계획' };
                default: return { bg: 'bg-slate-100 text-slate-700 border-slate-200', dot: 'bg-slate-500', name: type };
            }
        }

        function calculateDDay(dateStr) {
            if (!dateStr || dateStr === '-') return null;
            const targetDate = new Date(dateStr.replace(/-/g, '/'));
            if (isNaN(targetDate)) return null;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) return `D-${diffDays}`;
            if (diffDays === 0) return `D-DAY`;
            return `마감`;
        }

        function renderDashboard() {
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            const listEl = document.getElementById('notice-list');
            listEl.innerHTML = '';

            let filtered = allNotices.filter(item => {
                if (!isAdmin && item.isHidden) return false;
                if (currentTypeFilter !== 'ALL' && item.ntceKindNm !== currentTypeFilter) return false;
                if (keyword && !(item.ntceNm || '').toLowerCase().includes(keyword) && !(item.organ || '').toLowerCase().includes(keyword)) return false;
                return true;
            });

            // 정렬 순서: 1순위 중요 지정(isImportant) 맨 위, 2순위 최근 공고일(dateNotice) 기준 최신순
            filtered.sort((a, b) => {
                if (a.isImportant && !b.isImportant) return -1;
                if (!a.isImportant && b.isImportant) return 1;
                
                const dateA = new Date(a.dateNotice || '1970-01-01');
                const dateB = new Date(b.dateNotice || '1970-01-01');
                return dateB - dateA;
            });

            document.getElementById('notice-count').innerText = filtered.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="col-span-2 bg-white p-12 text-center rounded-xl border border-slate-200 text-slate-400">등록된 공고가 없습니다.</div>`;
                renderCalendar(currentCalendarDate, []);
                return;
            }

            filtered.forEach(item => {
                const isCheckedStyle = item.isChecked ? "bg-emerald-50/50 border-emerald-200 opacity-70" : "bg-white border-slate-200";
                const isImportantBorder = item.isImportant ? "border-l-4 border-l-rose-500 shadow-md" : "";
                const badge = getCategoryBadge(item.ntceKindNm);

                let ddayBadgeHtml = '';
                if (item.ntceKindNm === '본공고' || item.ntceKindNm === '민간입찰') {
                    const targetDt = item.dateOpen !== '-' ? item.dateOpen : item.dateLimit;
                    const dday = calculateDDay(targetDt);
                    if (dday) {
                        const ddayColor = dday === 'D-DAY' ? 'bg-rose-600 text-white animate-pulse' : (dday.startsWith('D-') ? 'bg-rose-100 text-rose-700' : 'bg-slate-200 text-slate-600');
                        ddayBadgeHtml = `<span class="px-2 py-0.5 text-xs font-bold rounded ${ddayColor}">${dday}</span>`;
                    }
                }

                let insttHtml = `<li class="text-slate-600">• 발주처: ${item.organ || '-'}</li>`;
                if (item.demandInstt && item.demandInstt !== '-') {
                    insttHtml += `<li class="text-slate-600">• 수요처: ${item.demandInstt}</li>`;
                }

                let priceHtml = '';
                if (item.price && item.price !== '0원' && item.price !== '미기재' && item.price !== 0) {
                    const priceFormatted = typeof item.price === 'number' ? item.price.toLocaleString() + '원' : item.price;
                    priceHtml = `
                        <div class="mt-3">
                            <div class="font-bold text-xs text-slate-700 mb-1">2. 용역비</div>
                            <ul class="text-xs space-y-1 pl-2">
                                <li class="text-slate-600">${priceFormatted}</li>
                            </ul>
                        </div>`;
                }

                let scheduleHtml = '';
                if (item.ntceKindNm === '발주계획') {
                    scheduleHtml = `• 계획공고: ${item.dateNotice || '-'}<br>• 발주시기: ${item.orderPeriod || '-'}`;
                } else if (item.ntceKindNm === '사전규격') {
                    scheduleHtml = `• 사전공고: ${item.dateNotice || '-'}<br>• 의견마감: ${item.opninCloseDt || item.dateLimit || '-'}`;
                } else if (item.ntceKindNm === '민간입찰') {
                    scheduleHtml = `• 공고일: ${item.dateNotice || '-'}<br>• 현설일: ${item.dateBrief || '-'}<br>• 마감일: ${item.dateLimit || '-'}<br>• 개찰일: ${item.dateOpen || '-'}`;
                } else {
                    scheduleHtml = `• 공고일: ${item.dateNotice || '-'}<br>• 현설일: ${item.dateBrief || '-'}<br>• 등록일: ${item.dateReg || '-'}<br>• 제출일: ${item.dateLimit || '-'}<br>• 평가일: ${item.dateOpen || '-'}`;
                }

                let urlHtml = '';
                if (item.url) {
                    urlHtml = `<div class="mt-3 text-xs"><b>바로가기:</b> <a href="${item.url}" target="_blank" class="text-blue-600 hover:underline font-semibold">[나라장터 바로가기]</a></div>`;
                }

                let filesHtml = '';
                if (item.files && item.files.length > 0) {
                    let fList = item.files.map(f => `<li><a href="${f.url}" target="_blank" class="text-blue-600 hover:underline">${f.name}</a></li>`).join('');
                    filesHtml = `
                        <div class="mt-3">
                            <div class="font-bold text-xs text-slate-700 mb-1">첨부파일</div>
                            <ul class="text-xs space-y-1 pl-2 list-disc list-inside">${fList}</ul>
                        </div>`;
                }

                let chgHtml = '';
                if (item.chgRsn && item.chgRsn !== '-') {
                    chgHtml = `<div class="text-rose-600 font-bold text-xs mb-2">* 변경/취소 사유: ${item.chgRsn}</div>`;
                }

                listEl.innerHTML += `
                    <div class="p-5 rounded-xl border ${isCheckedStyle} ${isImportantBorder} shadow-sm flex flex-col justify-between transition hover:shadow relative">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <span class="px-2 py-0.5 border font-bold text-xs rounded ${badge.bg}">${badge.name}</span>
                                ${ddayBadgeHtml}
                            </div>
                            <h3 class="font-bold text-sm text-slate-900 mb-2 leading-snug">${item.ntceNm}</h3>
                            ${chgHtml}
                            
                            <div class="mt-3">
                                <div class="font-bold text-xs text-slate-700 mb-1">1. 기관 정보</div>
                                <ul class="text-xs space-y-1 pl-2">${insttHtml}</ul>
                            </div>
                            
                            ${priceHtml}

                            <div class="mt-3">
                                <div class="font-bold text-xs text-slate-700 mb-1">3. 일정 정보</div>
                                <ul class="text-xs space-y-1 pl-2 text-slate-600">${scheduleHtml}</ul>
                            </div>

                            ${urlHtml}
                            ${filesHtml}
                        </div>

                        <div class="mt-5 pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                            <label class="flex items-center gap-1.5 font-medium cursor-pointer">
                                <input type="checkbox" ${item.isChecked ? 'checked' : ''} onchange="toggleCheck('${item.id}')" class="rounded text-blue-600 w-4 h-4">
                                <span>확인 완료</span>
                            </label>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleImportant('${item.id}')" class="px-2.5 py-1 rounded text-xs font-medium transition ${item.isImportant ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                    ${item.isImportant ? '★ 중요' : '중요 지정'}
                                </button>
                                ${isAdmin ? `<button onclick="toggleHide('${item.id}')" class="px-2.5 py-1 rounded text-xs font-medium bg-rose-100 text-rose-700">${item.isHidden ? '숨김해제' : '숨기기'}</button>` : ''}
                            </div>
                        </div>
                    </div>`;
            });

            renderCalendar(currentCalendarDate, filtered);
        }

        function toggleCheck(id) {
            const n = allNotices.find(x => x.id === id);
            if (n) {
                n.isChecked = !n.isChecked;
                saveState(id, { isChecked: n.isChecked });
                renderDashboard();
            }
        }

        function toggleImportant(id) {
            const n = allNotices.find(x => x.id === id);
            if (n) {
                n.isImportant = !n.isImportant;
                saveState(id, { isImportant: n.isImportant });
                renderDashboard();
            }
        }

        function toggleHide(id) {
            const n = allNotices.find(x => x.id === id);
            if (n) {
                n.isHidden = !n.isHidden;
                saveState(id, { isHidden: n.isHidden });
                renderDashboard();
            }
        }

        function saveState(id, state) {
            const local = JSON.parse(localStorage.getItem('notice_local_state') || '{}');
            local[id] = { ...local[id], ...state };
            localStorage.setItem('notice_local_state', JSON.stringify(local));
        }

        function filterType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = "tab-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100";
            });
            
            const activeTab = document.getElementById(`tab-${type}`);
            if (type === 'ALL') activeTab.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-white shadow-sm";
            else if (type === '본공고') activeTab.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white shadow-sm";
            else if (type === '민간입찰') activeTab.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-purple-600 text-white shadow-sm";
            else if (type === '사전규격') activeTab.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-600 text-white shadow-sm";
            else if (type === '발주계획') activeTab.className = "tab-btn px-4 py-2 rounded-lg text-sm font-semibold bg-orange-600 text-white shadow-sm";

            renderDashboard();
        }

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderDashboard();
        }

        function renderCalendar(baseDate, notices = allNotices) {
            const grid = document.getElementById('calendar-grid');
            document.getElementById('calendar-month').innerText = `${baseDate.getFullYear()}년 ${baseDate.getMonth() + 1}월`;
            grid.innerHTML = '';

            const year = baseDate.getFullYear();
            const month = baseDate.getMonth();

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="h-9"></div>`;
            }

            for (let d = 1; d <= lastDate; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                const activeEvents = [];
                notices.forEach(n => {
                    const start = (n.dateNotice || '').slice(0, 10);
                    const end = (n.dateOpen !== '-' ? n.dateOpen : n.dateLimit || '').slice(0, 10);
                    
                    if (start && end && start <= dateStr && dateStr <= end) {
                        const badge = getCategoryBadge(n.ntceKindNm);
                        activeEvents.push({ notice: n, badge: badge });
                    }
                });

                let dotsHtml = '';
                if (activeEvents.length > 0) {
                    const uniqueTypes = [...new Set(activeEvents.map(e => e.badge.dot))];
                    dotsHtml = `<div class="flex justify-center gap-0.5 mt-0.5 overflow-hidden">${uniqueTypes.slice(0, 3).map(dot => `<span class="w-1.5 h-1.5 rounded-full ${dot}"></span>`).join('')}</div>`;
                }

                grid.innerHTML += `
                    <div onclick="selectCalendarDate('${dateStr}')" class="h-9 border rounded flex flex-col items-center justify-start pt-1 cursor-pointer hover:bg-blue-50 transition ${activeEvents.length > 0 ? 'bg-blue-50/40 border-blue-200' : 'bg-slate-50 border-slate-200'}">
                        <span class="text-xs font-semibold text-slate-700">${d}</span>
                        ${dotsHtml}
                    </div>`;
            }
        }

        // 달력 날짜 클릭 시 -> 우측 하단 영역에 해당 날짜 공고 목록 표시
        function selectCalendarDate(dateStr) {
            document.getElementById('selected-date-label').innerText = `${dateStr} 진행 공고`;
            const listContainer = document.getElementById('calendar-day-notices');
            listContainer.innerHTML = '';

            const matched = [];
            allNotices.forEach(n => {
                const start = (n.dateNotice || '').slice(0, 10);
                const end = (n.dateOpen !== '-' ? n.dateOpen : n.dateLimit || '').slice(0, 10);
                
                if (start && end && start <= dateStr && dateStr <= end) {
                    let step = '진행 중';
                    if (start === dateStr) step = '공고일';
                    else if (end === dateStr) step = '마감/평가일';
                    else if (n.dateBrief && n.dateBrief.slice(0, 10) === dateStr) step = '현장설명일';

                    matched.push({ notice: n, step: step });
                }
            });

            document.getElementById('selected-count').innerText = `${matched.length}건`;

            if (matched.length === 0) {
                listContainer.innerHTML = `<div class="text-slate-400 text-center py-4 bg-slate-50 rounded-lg border border-slate-200">해당 날짜에 진행 중인 공고가 없습니다.</div>`;
                return;
            }

            matched.forEach(m => {
                const badge = getCategoryBadge(m.notice.ntceKindNm);
                // 목록의 항목을 클릭하면 openDetailModal()을 통해 상세 내용 팝업이 뜨도록 설정
                listContainer.innerHTML += `
                    <div onclick="openDetailById('${m.notice.id}')" class="p-2.5 rounded-lg bg-white border border-slate-200 hover:border-blue-400 cursor-pointer transition shadow-sm space-y-1">
                        <div class="flex items-center justify-between gap-1">
                            <span class="px-1.5 py-0.5 text-[10px] rounded font-bold border ${badge.bg}">${badge.name}</span>
                            <span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">${m.step}</span>
                        </div>
                        <div class="font-bold text-slate-800 truncate">${m.notice.ntceNm}</div>
                    </div>`;
            });
        }

        // 공고 항목 클릭 시 팝업 모달로 상세 내용 표시
        function openDetailById(id) {
            const item = allNotices.find(n => n.id === id);
            if (!item) return;

            const modal = document.getElementById('detail-modal');
            const badgeEl = document.getElementById('modal-badge');
            const bodyEl = document.getElementById('modal-content-body');

            const badge = getCategoryBadge(item.ntceKindNm);
            badgeEl.className = `px-2 py-0.5 text-xs rounded font-bold border ${badge.bg}`;
            badgeEl.innerText = badge.name;

            let insttHtml = `• 발주처: ${item.organ || '-'}<br>`;
            if (item.demandInstt && item.demandInstt !== '-') insttHtml += `• 수요처: ${item.demandInstt}<br>`;

            let priceHtml = '';
            if (item.price && item.price !== '0원' && item.price !== '미기재') {
                priceHtml = `<div class="font-bold text-xs text-slate-700 mt-2">2. 용역비</div><div class="text-xs text-slate-600 pl-2">${item.price}</div>`;
            }

            let scheduleHtml = '';
            if (item.ntceKindNm === '발주계획') scheduleHtml = `• 계획공고: ${item.dateNotice || '-'}<br>• 발주시기: ${item.orderPeriod || '-'}`;
            else if (item.ntceKindNm === '사전규격') scheduleHtml = `• 사전공고: ${item.dateNotice || '-'}<br>• 의견마감: ${item.opninCloseDt || item.dateLimit || '-'}`;
            else if (item.ntceKindNm === '민간입찰') scheduleHtml = `• 공고일: ${item.dateNotice || '-'}<br>• 현설일: ${item.dateBrief || '-'}<br>• 마감일: ${item.dateLimit || '-'}<br>• 개찰일: ${item.dateOpen || '-'}`;
            else scheduleHtml = `• 공고일: ${item.dateNotice || '-'}<br>• 현설일: ${item.dateBrief || '-'}<br>• 등록일: ${item.dateReg || '-'}<br>• 제출일: ${item.dateLimit || '-'}<br>• 평가일: ${item.dateOpen || '-'}`;

            let urlHtml = item.url ? `<div class="mt-3 text-xs"><b>바로가기:</b> <a href="${item.url}" target="_blank" class="text-blue-600 hover:underline font-semibold">[나라장터 바로가기]</a></div>` : '';

            let filesHtml = '';
            if (item.files && item.files.length > 0) {
                let fList = item.files.map(f => `<li><a href="${f.url}" target="_blank" class="text-blue-600 hover:underline">${f.name}</a></li>`).join('');
                filesHtml = `<div class="font-bold text-xs text-slate-700 mt-2">첨부파일</div><ul class="text-xs space-y-1 pl-2 list-disc list-inside">${fList}</ul>`;
            }

            bodyEl.innerHTML = `
                <div class="space-y-3">
                    <h4 class="font-bold text-base text-slate-900 leading-snug">${item.ntceNm}</h4>
                    <div>
                        <div class="font-bold text-xs text-slate-700">1. 기관 정보</div>
                        <div class="text-xs text-slate-600 pl-2 mt-1 space-y-0.5">${insttHtml}</div>
                    </div>
                    ${priceHtml}
                    <div>
                        <div class="font-bold text-xs text-slate-700">3. 일정 정보</div>
                        <div class="text-xs text-slate-600 pl-2 mt-1">${scheduleHtml}</div>
                    </div>
                    ${urlHtml}
                    ${filesHtml}
                </div>`;

            modal.classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function showStatus(msg) {
            document.getElementById('status-msg').innerText = msg;
            document.getElementById('status-bar').classList.remove('hidden');
        }
    </script>
</body>
</html>
